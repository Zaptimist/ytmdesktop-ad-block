name: Windows Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      YTMD_UPDATE_FEED_OWNER: ${{ github.repository_owner }}
      YTMD_UPDATE_FEED_REPOSITORY: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev --legacy-peer-deps
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build Windows installer
        run: npm run make -- --arch x64
      - name: Upload installer and updater assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: out/make/squirrel.windows/x64/*
          if-no-files-found: error
